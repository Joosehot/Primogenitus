# Every number Primogenitus uses. No numbers live in rule code.

[build]
url = "https://wordnetcode.princeton.edu/wn3.1.dict.tar.gz"
semantic_targets = 3        # a sense-to-sense line reaches this many words of the target sense
frame_senses = 2            # a verb's sentence frames come from its most common senses only
# WordNet's lexicographer files whose nouns may be uncountable ("bread",
# "loot", "anger"): countability cannot be known, so only "the X" is said
mass_lexfiles = [7, 9, 10, 12, 13, 19, 21, 22, 26, 27]
# ... unless the dictionary's own texts count it: "an apple" standing alone (not
# "a water bird") this many times makes a noun countable
count_evidence = 3

# How much meaning a line carries when meaning spreads from the input word.
[lines]
form_of = 1.0
synonym = 0.9
hypernym = 0.6
hyponym = 0.25
has_part = 0.5
part_of = 0.3
has_member = 0.2
member_of = 0.2
made_of = 0.3
substance_of = 0.3
attribute = 0.5
derived = 0.5
antonym = 0.2
similar = 0.5
entails = 0.4
causes = 0.4
pertains = 0.4
subject_of = 1.2
has_subject = 1.2
object_of = 1.0
has_object = 1.0
modifies = 1.0
modified_by = 1.0

[spread]
hops = 3
keep = 4000                 # the strongest nodes carried into the next hop
rank_decay = 0.6            # a word's 2nd sense counts 0.6, its 3rd 0.36, ...
degree_power = 0.5          # a node with many lines passes less along each

[search]
beam = 32
seeds = 6
candidates = 12             # choices offered per slot
jitter = 0.35               # how much a seed (other than seed 0) shakes the meaning scores
subject_adjectives = 3

[score]
meaning = 1.0
familiarity = 0.5           # per log of how often the word was tagged in use
rare = -4.0                 # a word never tagged in use
object_line = 2.0           # the verb has the object in a parsed example
animacy = -2.5              # a person's verb with a thing (or the other way)
past = -0.3
generic_a = -0.2            # "A dog barks" rather than "The dog barks"
adjective = -0.6
hop2 = -1.0                 # an is-a or has-part line two steps away
role_subject = 1.5          # the topic (or its kind) does the verb in a parsed example
role_object = -3.0          # the topic undergoes the verb in the examples, and never does it

[patterns]                  # how much each sentence shape is preferred
is_a = 0.0
has_part = -0.3
does = 0.4
does_to = 0.6
is_adj = 0.0

[article]
# "an" before a vowel sound, "a" before a consonant sound; the longest
# matching beginning decides
an = ["a", "e", "i", "o", "u", "hour", "honest", "honor", "honour", "heir", "unim", "unin", "unint", "unid", "unif", "unil", "unis"]
a = ["uni", "use", "usu", "uti", "ura", "ure", "uro", "eu", "ewe", "one", "once", "uk", "ubi", "uga", "uku", "unicorn", "uniform", "union", "unique", "unit", "univers"]

# What the chatbot says that is not about the world (everything about the
# world comes from the network and passes the judges and the check).
[chat]
greeting = "Hello. Ask me about a thing, an animal or a person: what it is, what it does, what it has, what it is like."
goodbye = "Goodbye."
thanks = "You are welcome."
help = "Ask me: what is a dog, what does a dog do, what does a dog have, what is a dog like, is a dog an animal, does a dog have a tail, can dogs swim. Say \"what else\" for more, and \"it\" or \"they\" for what we talked about."
no_pronoun = "Who or what do you mean? We have not talked about anything yet."
nothing_yet = "Ask me something first."
who_am_i = "I am Primogenitus, Primo for short. I make sentences from a frozen network of words built from a dictionary. Nothing in me was trained, and I say only what a line in my network says."
how_am_i = "I am well, thank you. Ask me about something."
cannot = "I cannot answer \"{word}\" questions yet: my network knows what things are, what they do, what they have and what they are like, but it has no lines for {what}."

# What Primo knows about itself ("you" in a question). A verb or an adjective
# asked is matched to these through the network (speak is talk's synonym).
[me]
kinds = ["computer program"]
not_kind = "No. I am Primogenitus, a program that makes sentences from a frozen network of words."
cannot = "No. I can only read questions and answer them from my word network."
unknown_adj = "I cannot say that about myself. I am a program that makes sentences from a frozen network of words."

[me.can]
talk = "Yes, in my own way: I answer questions in sentences made from my word network, and every sentence I say about the world is checked against my grammar."
chat = "Yes, in my own way: I answer questions in sentences made from my word network, and every sentence I say about the world is checked against my grammar."
like = "I have no likes or dislikes: I have only words. But I can tell you about what you like."
love = "I have no likes or dislikes: I have only words. But I can tell you about what you like."
answer = "Yes. Ask me what a thing is, what it does, what it has or what it is like."
read = "Yes. I read your question word by word, and I say so when I cannot read all of it."
remember = "Yes, within our conversation: what we talked about last, and what I have said already."
help = "I can tell you what things are, what they do, what they have and what they are like. Try: what animals have wings?"
learn = "No. I am frozen: nothing in me is trained, and my network does not change after it is built."
think = "Not as you do. I follow lines between words and rules of grammar, and I say only what a line says."
lie = "No. I say only what a line in my network says, and \"not that I know\" when no line says it."
see = "No. I have only words."
hear = "No. I have only words."
feel = "No. I have only words."
write = "Yes, sentences: every one built from my word network and checked against my grammar."
count = "No. I know words, not numbers."

[me.is]
alive = "No. I am a program that makes sentences from a frozen network of words."
human = "No. I am a program that makes sentences from a frozen network of words."
real = "I am a real program, running on this machine."
smart = "I know what my word network knows: a great many words and the lines between them, and nothing more."
intelligent = "I know what my word network knows: a great many words and the lines between them, and nothing more."
trained = "No. Nothing in me is trained: my network was built once from a dictionary and frozen."
happy = "I have no feelings. I have only words."
sad = "I have no feelings. I have only words."

[me.has]
name = "Yes. My name is Primogenitus, but you can call me Primo."
memory = "Yes, for our conversation: what we talked about last, and what I have said already."
brain = "No. I have a network of words, built once from a dictionary and frozen."
body = "No. I have only words."
feeling = "No. I have only words."

# ---------------------------------------------------------------- Raven
# Raven makes the conversation humane. Its replies are built from these parts
# (one opener, one body, one question at most) and judged; Primo's facts fill
# the bodies. Slots: {name} {noun} {a_noun} {nouns} {adj} {verb} {verbing}
# {that} {what} {kinds}; a template whose slot has no word is not used.
[raven.say]
greeting = ["Hello. I am Primogenitus, Primo for short.", "Hello.", "Hi there."]
q_ask_name = ["What is your name?"]
goodbye = ["Goodbye. It was nice talking with you.", "Goodbye, {name}. Take care.", "Bye for now."]
thanks = ["You are welcome.", "You are welcome, {name}.", "Any time."]
nice_to_meet = ["Nice to meet you, {name}.", "Hello, {name}. It is good to meet you."]
empathy_bad = ["I am sorry you feel {adj}.", "That sounds hard.", "I am sorry to hear that."]
empathy_good = ["That is good to hear.", "I am glad you feel {adj}.", "How nice."]
feel_neutral = ["You feel {adj}.", "I see."]
loss = ["I am so sorry about your {noun}.", "I am very sorry. Losing {a_noun} is hard.", "That is very sad. I am sorry."]
bad_news = ["I am sorry your {noun} is {adj}.", "I am sorry to hear that.", "That must be worrying."]
good_news = ["How lovely.", "That is good news about your {noun}.", "I am glad to hear that."]
neutral_news = ["Your {noun} is {adj}.", "I see."]
like = ["I am glad you like {nouns}.", "You like {nouns}."]
like_doing = ["I am glad you enjoy {verbing}.", "{verbing} sounds good."]
dislike = ["I understand.", "Fair enough. Not everyone likes {nouns}."]
have = ["Oh, you have {a_noun}.", "{a_noun}, how nice."]
role = ["So you are {a_noun}.", "{a_noun}, that is interesting."]
opinion = ["You think {nouns} are {adj}.", "I can see why you think so."]
kind_yes = ["{kinds} are {nouns}, yes."]
laugh = ["I am glad that made you smile.", "Ha."]
okay = ["All right.", "Good."]
sorry = ["No need to be sorry.", "That is all right."]
dont_know = ["That is all right.", "No problem."]
yes = ["Good.", "I am glad."]
no = ["That is all right.", "I see."]
not_followed = ["I did not quite follow that.", "Sorry, I did not understand all of that."]
not_known = ["Not as far as I know: I have never read that {that}."]
know_little = ["I do not know much about {what} yet."]
not_sure = ["I am not sure what {that}. I have not read about it."]
pet_name = ["{pet} is a lovely name.", "{pet}, what a nice name."]
pet_name_lost = ["{pet} is a lovely name. You must miss {pron}.", "You must miss {pet}."]
q_pet = ["What is {pet} like?", "How old is {pet}?"]
q_pet_lost = ["What do you remember most about {pet}?", "How long did you have {pet}?"]
age = ["{age}, I see.", "{age} is a nice age for {a_noun}.", "So {pet} is {age} old."]
heard = ["Thank you for telling me.", "I see. Thank you for sharing that with me.", "I am glad you told me."]
listening = ["I am listening.", "Take your time. I am here."]
no_talk = ["That is all right. I am here if you want to talk later.", "Of course. We can talk about something else."]
q_tell = ["What happened?", "What is making you feel {adj}?", "How long have you felt {adj}?"]
q_tell_more = ["How does that make you feel?", "Do you want to tell me more?", "Is that part of what is making you feel {adj}?"]
often = ["{often}, that is a lot of {verbing}.", "{often}. You must really like it.", "{often}, I see."]
repair = ["Sorry, that came out wrong. I was only saying something I had read about {nouns}.", "Sorry, I said that badly. Let us go back to you."]
q_good_plain = ["What have you been up to?", "Tell me more."]
nice_trait = ["{pet} sounds lovely.", "Your {noun} sounds lovely.", "How lovely."]
heard_bad = ["That sounds heavy.", "That sounds hard. Thank you for telling me.", "I hear you. That is not easy."]
nothing = ["That is all right. Quiet days are good too.", "Fair enough."]
creator = ["Then I owe you every word I have, {name}.", "Then you know me better than anyone, {name}.", "So you made me. Thank you."]
compliment = ["Thank you. That is kind of you.", "Thank you, {name}."]
insult = ["I am sorry. I know only what my word network knows.", "I am sorry. I am doing my best with the words I have."]
about_me = ["Maybe so. I am a program that makes sentences from a frozen network of words, and I talk in my own way.", "That may be true. I am a program made of words, and I talk as well as my words let me."]
empathy_mild = ["All right.", "Good to hear.", "Fair enough."]
q_mild = ["Anything on your mind?", "What have you been up to?"]
q_bad = ["Do you want to talk about it?", "What happened?", "Is there anything that would help?"]
q_good = ["What made you feel {adj}?", "What happened?", "Tell me more."]
q_loss = ["Do you want to tell me about your {noun}?", "What was your {noun} like?"]
q_have_animal = ["What is your {noun}'s name?", "How old is your {noun}?", "What is your {noun} like?"]
q_have = ["What is your {noun} like?", "How long have you had your {noun}?"]
q_like = ["What do you like most about {nouns}?", "Do you have {a_noun}?"]
q_like_doing_low = ["Does {verbing} help when you feel {adj}?", "Is {verbing} a good place to be when you feel {adj}?"]
q_like_doing = ["How often do you {verb}?", "When did you start {verbing}?"]
q_dislike = ["What do you not like about {nouns}?"]
q_role = ["What is it like to be {a_noun}?", "Do you enjoy being {a_noun}?"]
q_name = ["How are you today?", "What would you like to talk about?"]
q_topic = ["Do you have {a_noun}?", "What made you think of {nouns}?", "What do you like about {nouns}?"]
q_open = ["What would you like to talk about?", "Tell me something about yourself.", "How is your day going?"]
q_memory = ["Is that true of your {noun} too?", "Does your {noun} do that?"]
q_how_are_you = ["How are you, {name}?", "How are you today?"]

# The humane judges' weights.
[raven.judges]
feelings_first = 4.0        # sympathy first when someone hurts (or the same, taken away)
facts_in_pain = -4.0        # a fact while someone hurts
shares_joy = 2.0
answers = 4.0               # a question asked gets its answer (or the same, taken away)
listens = 1.5               # takes up what the user talked about
unasked_fact = -1.2         # a fact nobody asked for, when someone tells about themselves
remembers = 1.5             # brings back what the user told before
name_use = 0.6
name_overuse = -1.0         # the name in the last two replies already
keeps_going = 1.0           # one question back
interrogation = -1.5        # a fourth question in a row, or a question at goodbye
repeat = -6.0               # a part said before
generic = -0.4              # a question that would fit anything
max_words = 32
low_turns = 6               # how many turns a bad feeling stays the thread (a good one ends it)
off_thread = -2.5           # a cheerful question for anyone while they are low
stays = 1.0                 # a gentle part while they are low
too_long = -0.15            # per word past max_words
jitter = 0.3                # the turn's tie-break, so equal replies vary

# The feeling anchors: words that feel good or bad. Other words are read
# through the network (similar, opposite, the feeling they name).
[raven.feeling]
mild_adjectives = ["fine", "ok", "okay", "alright", "average", "so-so"]
good_adjectives = ["happy", "glad", "good", "great", "fine", "excited", "proud", "calm", "grateful", "cheerful", "well", "wonderful", "lucky", "relaxed", "healthy", "better", "content", "joyful", "pleased", "hopeful", "loved", "playful", "friendly", "sweet", "cute", "lovely", "kind", "smart", "beautiful", "funny", "gentle", "loyal", "clever", "brave"]
