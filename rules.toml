# Every number Primogenitus uses. No numbers live in rule code.

[build]
url = "https://wordnetcode.princeton.edu/wn3.1.dict.tar.gz"
semantic_targets = 3        # a sense-to-sense line reaches this many words of the target sense
frame_senses = 2            # a verb's sentence frames come from its most common senses only
# WordNet's lexicographer files whose nouns may be uncountable ("bread",
# "loot", "anger"): countability cannot be known, so only "the X" is said
mass_lexfiles = [7, 9, 10, 12, 13, 19, 21, 22, 26, 27]
# ... unless the dictionary's own texts count it: "an apple" standing alone (not
# "a water bird") this many times makes a noun countable
count_evidence = 3

# How much meaning a line carries when meaning spreads from the input word.
[lines]
form_of = 1.0
synonym = 0.9
hypernym = 0.6
hyponym = 0.25
has_part = 0.5
part_of = 0.3
has_member = 0.2
member_of = 0.2
made_of = 0.3
substance_of = 0.3
attribute = 0.5
derived = 0.5
antonym = 0.2
similar = 0.5
entails = 0.4
causes = 0.4
pertains = 0.4
subject_of = 1.2
has_subject = 1.2
object_of = 1.0
has_object = 1.0
modifies = 1.0
modified_by = 1.0

[spread]
hops = 3
keep = 4000                 # the strongest nodes carried into the next hop
rank_decay = 0.6            # a word's 2nd sense counts 0.6, its 3rd 0.36, ...
degree_power = 0.5          # a node with many lines passes less along each

[search]
beam = 32
seeds = 6
candidates = 12             # choices offered per slot
jitter = 0.35               # how much a seed (other than seed 0) shakes the meaning scores
subject_adjectives = 3

[score]
meaning = 1.0
familiarity = 0.5           # per log of how often the word was tagged in use
rare = -4.0                 # a word never tagged in use
object_line = 2.0           # the verb has the object in a parsed example
animacy = -2.5              # a person's verb with a thing (or the other way)
past = -0.3
generic_a = -0.2            # "A dog barks" rather than "The dog barks"
adjective = -0.6
hop2 = -1.0                 # an is-a or has-part line two steps away
role_subject = 1.5          # the topic (or its kind) does the verb in a parsed example
role_object = -3.0          # the topic undergoes the verb in the examples, and never does it

[patterns]                  # how much each sentence shape is preferred
is_a = 0.0
has_part = -0.3
does = 0.4
does_to = 0.6
is_adj = 0.0

[article]
# "an" before a vowel sound, "a" before a consonant sound; the longest
# matching beginning decides
an = ["a", "e", "i", "o", "u", "hour", "honest", "honor", "honour", "heir", "unim", "unin", "unint", "unid", "unif", "unil", "unis"]
a = ["uni", "use", "usu", "uti", "ura", "ure", "uro", "eu", "ewe", "one", "once", "uk", "ubi", "uga", "uku", "unicorn", "uniform", "union", "unique", "unit", "univers"]

# What the chatbot says that is not about the world (everything about the
# world comes from the network and passes the judges and the check).
[chat]
greeting = "Hello. Ask me about a thing, an animal or a person: what it is, what it does, what it has, what it is like."
goodbye = "Goodbye."
thanks = "You are welcome."
help = "Ask me: what is a dog, what does a dog do, what does a dog have, what is a dog like, is a dog an animal, does a dog have a tail, can dogs swim. Say \"what else\" for more, and \"it\" or \"they\" for what we talked about."
no_pronoun = "Who or what do you mean? We have not talked about anything yet."
nothing_yet = "Ask me something first."
who_am_i = "I am Primo. I make sentences from a frozen network of words built from a dictionary. Nothing in me was trained, and I say only what a line in my network says."
how_am_i = "I am well, thank you. Ask me about something."
cannot = "I cannot answer \"{word}\" questions yet: my network knows what things are, what they do, what they have and what they are like, but it has no lines for {what}."

# What Primo knows about itself ("you" in a question). A verb or an adjective
# asked is matched to these through the network (speak is talk's synonym).
[me]
kinds = ["computer program"]
not_kind = "No. I am Primo, a program that makes sentences from a frozen network of words."
cannot = "No. I can only read questions and answer them from my word network."
unknown_adj = "I cannot say that about myself. I am a program that makes sentences from a frozen network of words."

[me.can]
talk = "Yes, in my own way: I answer questions in sentences made from my word network, and every sentence I say about the world is checked against my grammar."
chat = "Yes, in my own way: I answer questions in sentences made from my word network, and every sentence I say about the world is checked against my grammar."
answer = "Yes. Ask me what a thing is, what it does, what it has or what it is like."
read = "Yes. I read your question word by word, and I say so when I cannot read all of it."
remember = "Yes, within our conversation: what we talked about last, and what I have said already."
help = "I can tell you what things are, what they do, what they have and what they are like. Try: what animals have wings?"
learn = "No. I am frozen: nothing in me is trained, and my network does not change after it is built."
think = "Not as you do. I follow lines between words and rules of grammar, and I say only what a line says."
lie = "No. I say only what a line in my network says, and \"not that I know\" when no line says it."
see = "No. I have only words."
hear = "No. I have only words."
feel = "No. I have only words."
write = "Yes, sentences: every one built from my word network and checked against my grammar."
count = "No. I know words, not numbers."

[me.is]
alive = "No. I am a program that makes sentences from a frozen network of words."
human = "No. I am a program that makes sentences from a frozen network of words."
real = "I am a real program, running on this machine."
smart = "I know what my word network knows: a great many words and the lines between them, and nothing more."
intelligent = "I know what my word network knows: a great many words and the lines between them, and nothing more."
trained = "No. Nothing in me is trained: my network was built once from a dictionary and frozen."
happy = "I have no feelings. I have only words."
sad = "I have no feelings. I have only words."
