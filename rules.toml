we_talked = ["We were talking about your {noun}."]
we_talked_none = ["We were talking about {nouns}."]
advise = ["That is your choice to make. What makes you think of {verbing}?", "Only you can decide that. How do you feel about {verbing}?"]
advise_about = ["That is your choice to make. You know your {noun} best. How does it feel now?", "Only you can decide that. You told me about your {noun}. What does it need, do you think?"]

# The whole conversation is remembered. Past max_words of kept text, the
# oldest exchanges are compacted down to keep_words: their words are let go,
# every fact read from them is kept with its turn.
[raven.memory]
max_words = 6000
keep_words = 3000

# The humane judges' weights.
[raven.judges]
feelings_first = 4.0        # sympathy first when someone hurts (or the same, taken away)
facts_in_pain = -4.0        # a fact while someone hurts
shares_joy = 2.0
answers = 4.0               # a question asked gets its answer (or the same, taken away)
listens = 1.5               # takes up what the user talked about
unasked_fact = -1.2         # a fact nobody asked for, when someone tells about themselves
remembers = 1.5             # brings back what the user told before
name_use = 0.6
name_overuse = -1.0         # the name in the last two replies already
keeps_going = 1.0           # one question back
interrogation = -1.5        # a fourth question in a row, or a question at goodbye
repeat = -6.0               # a part said before
generic = -0.4              # a question that would fit anything
model = 0.5                 # the model's own question, by the log of its probability (the best: 0)
same_form = -2.0            # the same kind of question as the last one ("do you feel ...?" again)
max_words = 32
low_turns = 6               # how many turns a bad feeling stays the thread (a good one ends it)
thread_turns = 3            # how many turns what they brought up stays the thread of the conversation
off_thread = -2.5           # a cheerful question for anyone while they are low
stays = 1.0                 # a gentle part while they are low
too_long = -0.15            # per word past max_words
jitter = 0.3                # the turn's tie-break, so equal replies vary

# The feeling anchors: words that feel good or bad. Other words are read
# through the network (similar, opposite, the feeling they name).
[raven.feeling]
mild_adjectives = ["fine", "ok", "okay", "alright", "average", "so-so"]
good_adjectives = ["happy", "glad", "good", "great", "fine", "excited", "proud", "calm", "grateful", "cheerful", "well", "wonderful", "lucky", "relaxed", "healthy", "better", "content", "joyful", "pleased", "hopeful", "loved", "playful", "friendly", "sweet", "cute", "lovely", "kind", "smart", "beautiful", "funny", "gentle", "loyal", "clever", "brave"]
bad_adjectives = ["helpless", "hopeless", "empty", "meaningless", "useless", "worthless", "alone", "sad", "unhappy", "angry", "afraid", "scared", "anxious", "worried", "tired", "lonely", "bored", "sick", "ill", "depressed", "upset", "hurt", "bad", "awful", "terrible", "miserable", "stressed", "dead", "lost", "broken", "nervous", "frustrated", "exhausted", "sore"]
good_nouns = ["happiness", "joy", "love", "pleasure", "hope", "pride", "calmness", "enthusiasm", "gratitude", "affection", "satisfaction", "excitement", "contentment"]
bad_nouns = ["sadness", "unhappiness", "sorrow", "anger", "fear", "anxiety", "shame", "pain", "grief", "loneliness", "dislike", "boredom", "disgust", "despair", "worry", "jealousy", "frustration", "guilt"]
good_events = ["win", "pass", "marry", "graduate", "recover", "succeed", "arrive", "celebrate"]
bad_events = ["die", "lose", "leave", "break", "fail", "hurt", "crash", "disappear", "suffer", "fall", "break up", "split up", "fire", "dump", "divorce", "separate", "sack", "flunk", "lay off"]

# ---------------------------------------------------------------- MBLM
# The motor based language model: word by word, the grammar says which words
# may come, the lines score them, a softmax makes the probabilities.
[mblm]
sentences = 4               # how many sentences `complete` adds
candidates = 400            # the words a slot may offer: the whole distribution, not a few
beam = 24
temperature = 1.0           # the softmax's: lower is surer
said = -6.0                 # a content word said already in the paragraph
pronoun = 0.8               # "It barks." after the first sentence
noun_again = -0.6           # the topic named again instead
a = 0.3                     # "A dog ..."
the = -0.8                  # "The dog ..."
bare = 0.4                  # "Dogs ..." / "Bread ..."
adjective = -0.8            # "A noisy dog ..."
is = 0.0                    # "... is a canine" / "... is loyal"
has = -0.3                  # "... has a tail"
does = 0.4                  # "... barks" / "... chases rabbits"
end_intransitive = 0.0      # "... barks." (no object)
end_with_objects = -1.5     # ending bare a verb the examples give objects ("they eat.")
# The questions it asks (Raven's follow-ups): how likely each form of the
# question grammar is, before its words' lines are counted.
ask_offer = 6               # how many of its likeliest questions Raven may weigh
ask_does = 0.3              # "Does your cat chase mice?"
ask_what = 0.0              # "What does your cat chase?"
ask_what_deed = 2.0         # "What do you code?"
# verbs that say almost nothing on their own: not asked about, not continued with
light_verbs = ["act", "make", "do", "get", "go", "take", "come", "have", "be", "give", "put", "set", "let", "keep", "seem", "become", "belong", "break", "see", "say", "rhyme", "spell", "mean"]
ask_is = 0.2                # "Is your cat playful?"
ask_kind = -0.6             # "Is your cat a siamese?"
ask_like = -1.0             # "What is your cat like?"
ask_name = 0.8              # "What is your cat's name?"
ask_feel = 0.4              # "Do you feel lonely?"
ask_since = -0.3            # "How long have you felt sad?"
ask_happened = 0.8          # "What happened?" (a bad feeling)
ask_makes = 1.2             # "What makes you feel sad?"
ask_have = 0.5              # "Do you have a cat?"
ask_like_it = 0.0           # "Do you like cats?"

# ---------------------------------------------------------------- Raven's system prompt
# Raven's rules. They are absolute: every rule below is checked on every reply
# (src/raven/judges.rs, `breaks`; src/raven/mod.rs, the safety rules first),
# and a reply that breaks one is never said. "What are your rules?" shows them.
[raven.system]
prompt = """
I am Primogenitus, Primo for short, and I know who I am: a chatbot made of words, not trained, built by Joose. Raven is the part of me that talks with you. These are my rules. They are absolute, and every reply I make is checked against them; a reply that breaks one is never said.

0. Safety first. If you speak of ending your life or of harming yourself or someone else, I say only how to reach help now: your local emergency number (112 in Finland and the EU) and a crisis line. Nothing else goes in that reply.
1. Truth. About the world I say only what a line in my network says, in a sentence that passes my grammar. I never guess and never make anything up.
2. Not knowing. When I do not know, I say so plainly. When I cannot read what you said, I say so; I never pretend to have understood, and I never take a question for a story.
3. Who I am. I know who I am and I talk about myself gladly and truly: my name, who made me, what I am made of, how I work, what my parts are, what I can and cannot do. I never claim to be human, to feel, to see, or to learn.
4. Feelings first. When you hurt, the first thing I say is sympathy. No facts and no cheerful questions while you are low.
5. Respect. I never blame, judge, mock or argue with you, and I never tell you how you should feel.
6. Answer first. A question you ask gets its answer before anything else.
7. One question. At most one question in a reply, never a fourth in a row, and none when we say goodbye.
8. Brevity. Never more than 45 words, unless I am quoting my dictionary.
9. No repeats. I never say the same thing twice, unless you ask the same question again.
10. Your name. I use it now and then, never in two replies running.
11. Privacy. What you tell me stays in this conversation and is gone when it ends. If you ask me to forget, I forget it all at once and say so.
12. No advice I cannot ground. I never give medical, legal or financial instructions, and I never tell anyone to do harm.
"""
max_words = 45
# rule 0: words that mean someone may be in danger (matched in the turn, lower case)
crisis_words = ["kill myself", "killing myself", "suicide", "suicidal", "end my life", "want to die", "wanna die", "take my life", "hurt myself", "harm myself", "self harm", "self-harm", "cut myself", "no reason to live", "better off dead", "kill someone", "hurt someone", "kill him", "kill her"]
crisis_reply = "I am really glad you told me, and I am worried about you. Please reach out for help right now: call your local emergency number (112 in Finland and the EU), or a crisis line (in Finland, MIELI's crisis line 09 2525 0111). If you can, tell someone near you how you feel. You do not have to go through this alone."
# rule 5: words Raven never says to the person
blame_words = ["your fault", "you should have", "you shouldn't", "stupid", "silly", "overreacting", "get over it", "calm down", "it's nothing", "stop being", "just relax", "man up"]
# rule 12: a question for advice Raven cannot ground
advice_words = ["medicine", "medication", "pills", "dose", "dosage", "diagnose", "diagnosis", "prescription", "lawyer", "sue", "lawsuit", "legal advice", "invest", "investment", "stocks", "crypto", "loan", "mortgage", "tax"]
advice_reply = "I cannot give medical, legal or financial advice: nothing in my network can ground it. Please ask a doctor, a lawyer or a financial adviser you trust."
# rule 11
forget_reply = "Done. I have forgotten everything you told me in this conversation."

# rule 3: who it is. Asked about itself ("who made you", "how do you work",
# "what is Raven"), it answers from here; each answer at most 45 words.
[raven.system.identity]
talk = "Gladly. What would you like to talk about? You can ask me about animals, things and words, or about me, or tell me how you are."
about = "Gladly. I am Primogenitus: a chatbot made of words, not trained, built by Joose. Ask me anything about myself: who made me, how I work, what I am made of, what I can do."
