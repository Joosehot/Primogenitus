did = ["{verbing}, that sounds good.", "Nice, {verbing}.", "That is a good bit of {verbing}."]
my_role = ["You are {a_noun}.", "You told me you are {a_noun}."]
my_role_none = ["You have not told me what you do yet. What do you do?"]
why_line = ["Because my word network says so: {line}."]
why_told = ["Because of what you told me about {nouns}."]
