<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo</title>
<style>
  :root {
    --bg: #070707;
    --panel: #111111;
    --panel-2: #181818;
    --line: #262626;
    --red: #e3122c;
    --red-deep: #9e0a1c;
    --red-glow: rgba(227, 18, 44, 0.35);
    --text: #ffffff;
    --muted: #9a9a9a;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(227, 18, 44, 0.18), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(7, 7, 7, 0.8);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(145deg, var(--red), var(--red-deep));
    box-shadow: 0 0 24px var(--red-glow);
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px; letter-spacing: -0.5px;
  }
  .name { font-weight: 800; letter-spacing: 3px; font-size: 18px; }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: 0.5px; }
  .new {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .new:hover { border-color: var(--red); background: rgba(227, 18, 44, 0.08); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 16px 12px;
  }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; flex-direction: column; max-width: 82%; animation: rise .22s ease-out; }
  .msg.you { align-self: flex-end; align-items: flex-end; }
  .msg.primo { align-self: flex-start; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    word-wrap: break-word;
  }
  .you .bubble {
    background: linear-gradient(145deg, var(--red), var(--red-deep));
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 24px rgba(227, 18, 44, 0.18);
  }
  .primo .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--red);
    border-bottom-left-radius: 6px;
  }
  .meta { display: flex; gap: 12px; align-items: center; margin-top: 6px; padding-left: 4px; }
  .ms { color: var(--muted); font-size: 12px; }
  .why-toggle {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12px; padding: 0; letter-spacing: 0.5px;
  }
  .why-toggle:hover { color: var(--red); }
  .why-toggle::before { content: "\25B8  "; }
  .why-toggle[aria-expanded="true"]::before { content: "\25BE  "; }
  .why { display: none; margin-top: 8px; flex-direction: column; gap: 8px; }
  .why.open { display: flex; }
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .node {
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 3px 10px; border-radius: 999px; font-size: 13px;
  }
  .edge { color: var(--red); font-size: 12px; white-space: nowrap; }
  .edge::after { content: " \2192"; }

  .typing .bubble { display: flex; gap: 5px; padding: 16px 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  footer {
    padding: 10px 16px 18px;
    border-top: 1px solid var(--line);
    background: rgba(7, 7, 7, 0.9);
  }
  .chips { max-width: 760px; margin: 0 auto 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: transparent; color: var(--text);
    border: 1px solid var(--red-deep); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .chip:hover { background: rgba(227, 18, 44, 0.12); border-color: var(--red); }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  input {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 14px 20px; font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #6b6b6b; }
  input:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); }
  .send {
    flex: none; width: 50px; height: 50px; border-radius: 50%;
    border: none; cursor: pointer; color: var(--text);
    background: linear-gradient(145deg, var(--red), var(--red-deep));
    box-shadow: 0 0 20px var(--red-glow);
    display: grid; place-items: center;
    transition: transform .1s;
  }
  .send:active { transform: scale(.94); }
  .send svg { width: 20px; height: 20px; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .sub { display: none; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">P</div>
    <div>
      <div class="name">PRIMO</div>
      <div class="sub">a frozen word network, no training</div>
    </div>
  </div>
  <button class="new" id="new" type="button">New chat</button>
</header>

<main id="scroll"><div class="thread" id="thread"></div></main>

<footer>
  <div class="chips" id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="q" placeholder="Ask Primo: what does a dog do?" aria-label="Your question">
    <button class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</footer>

<script>
const thread = document.getElementById("thread");
const scroller = document.getElementById("scroll");
const input = document.getElementById("q");
const SUGGEST = ["What is a dog?", "What do dogs eat?", "What else?", "Which animals swim?",
                 "What animals have wings?", "What kind of animal is a dog?", "How big is a whale?",
                 "Is a whale a mammal?", "Who are you?"];

function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

// "dog -is a-> domestic animal -is a-> animal" -> words and the lines between them
function pathEl(line) {
  const el = document.createElement("div");
  el.className = "path";
  const parts = line.split(/ -(.+?)-> /);
  parts.forEach((p, i) => {
    const s = document.createElement("span");
    s.className = i % 2 ? "edge" : "node";
    s.textContent = p;
    el.appendChild(s);
  });
  return el;
}

function add(who, text, why, ms) {
  const m = document.createElement("div");
  m.className = "msg " + who;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  m.appendChild(b);
  if (who === "primo" && (why && why.length || ms !== undefined)) {
    const meta = document.createElement("div");
    meta.className = "meta";
    let box = null;
    if (why && why.length) {
      const t = document.createElement("button");
      t.className = "why-toggle";
      t.type = "button";
      t.textContent = "why";
      t.setAttribute("aria-expanded", "false");
      box = document.createElement("div");
      box.className = "why";
      why.forEach(w => box.appendChild(pathEl(w)));
      t.onclick = () => {
        const open = box.classList.toggle("open");
        t.setAttribute("aria-expanded", open);
        scrollDown();
      };
      meta.appendChild(t);
    }
    if (ms !== undefined) {
      const s = document.createElement("span");
      s.className = "ms";
      s.textContent = ms < 1 ? "<1 ms" : Math.round(ms) + " ms";
      meta.appendChild(s);
    }
    m.appendChild(meta);
    if (box) m.appendChild(box);
  }
  thread.appendChild(m);
  scrollDown();
  return m;
}

function typing() {
  const m = document.createElement("div");
  m.className = "msg primo typing";
  m.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  thread.appendChild(m);
  scrollDown();
  return m;
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}

async function ask(q) {
  q = q.trim();
  if (!q) return;
  add("you", q);
  input.value = "";
  const t = typing();
  try {
    const [r] = await Promise.all([post("/ask", { q }), new Promise(res => setTimeout(res, 260))]);
    t.remove();
    add("primo", r.text, r.why, r.ms);
  } catch (e) {
    t.remove();
    add("primo", "I could not reach the motor. Is `primogenitus serve` running?");
  }
  input.focus();
}

async function start() {
  thread.innerHTML = "";
  try {
    const r = await post("/start");
    add("primo", r.text);
  } catch (e) {
    add("primo", "I could not reach the motor. Is `primogenitus serve` running?");
  }
  input.focus();
}

const chips = document.getElementById("chips");
SUGGEST.forEach(s => {
  const c = document.createElement("button");
  c.className = "chip";
  c.type = "button";
  c.textContent = s;
  c.onclick = () => ask(s);
  chips.appendChild(c);
});
document.getElementById("form").onsubmit = e => { e.preventDefault(); ask(input.value); };
document.getElementById("new").onclick = start;
start();
</script>
</body>
</html>
