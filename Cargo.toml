[package]
name = "primogenitus"
version = "0.1.0"
edition = "2021"
description = "A motor that produces sentences: a frozen word network built once from a dictionary, sentences by the HotMotor pipeline"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1.3"
ureq = "2"
flate2 = "1"
tar = "0.4"

[profile.release]
debug = false
